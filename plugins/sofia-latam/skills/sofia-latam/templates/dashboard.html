<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sofia · Dashboard de análisis</title>
  <style>
    :root{color-scheme:dark;--bg:#101014;--card:#1a1a21;--line:#30303b;--text:#f5f3ef;--muted:#aaa6b2;--lime:#d9ff63;--violet:#a78bfa;--orange:#ff6b35}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 20px 80px}header{padding-bottom:24px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,72px);line-height:1;margin:10px 0}h2{font-size:24px;margin:0 0 14px}h3{font-size:18px;margin:0 0 10px}.muted,.meta{color:var(--muted)}a{color:var(--violet)}nav{display:flex;gap:8px;overflow:auto;padding:18px 0;position:sticky;top:0;background:rgba(16,16,20,.96);z-index:3}nav a{white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.wide{grid-column:1/-1}.summary{margin:26px 0}.video{scroll-margin-top:76px;border-top:1px solid var(--line);padding-top:30px;margin-top:38px}.video-head{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.score{font-size:42px;font-weight:900;color:var(--lime)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px}th{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.frame img{display:block;width:100%;border-radius:10px;border:1px solid var(--line)}.frame figcaption{color:var(--muted);font-size:12px;margin-top:5px}.timeline,.script,.comments{display:grid;gap:10px}.moment,.line,.comment{background:#131318;border:1px solid var(--line);border-radius:10px;padding:13px}.time{color:var(--violet);font-weight:800}.quote{border-left:3px solid var(--lime);padding-left:12px;margin-bottom:6px}.tag{display:inline-block;border:1px solid #4a4659;border-radius:999px;padding:2px 7px;margin:2px;font-size:11px;color:var(--violet)}.warning{border-left:3px solid var(--orange)}@media(max-width:760px){.card{grid-column:1/-1}.video-head{display:block}}
  </style>
</head>
<body><main class="wrap">
  <header><div class="eyebrow">Sofia · análisis visual</div><h1>Dashboard de videos</h1><p class="meta" id="meta"></p></header>
  <nav id="nav"></nav>
  <section class="summary grid" id="summary"></section>
  <div id="videos"></div>
</main>

<!-- Sofia reemplaza TODO el contenido de este bloque por el lote actual o por el acervo acumulado.
     Comentarios: {"texto","likes","insight"} — nunca el @ ni el nombre de quien comentó.
     Cuadros: {"src","tiempo","descripcion"}, con "src" relativo a sofia-latam/analisis/ (ej.: cuadros/ID/frames/t-00001.jpg). -->

<script id="sofia-data" type="application/json">
[
  {
    "id":"ejemplo-1","titulo":"Ejemplo 1","creador":"@creador","plataforma":"TikTok","url":"https://example.com/video-1","duracion":"00:30","ruta":"A","metricas":{"vistas":1000,"likes":100,"comentarios":10,"compartidos":5},"hook":{"nota":8,"texto":"Apertura del ejemplo","analisis":"Promete una respuesta clara sin entregarlo todo."},"diagnostico":"Tema conocido con una tensión fácil de entender.","formato":"Charla","estructura":"IHC","variablePrincipal":"Apertura específica","cuadros":[],"lineaDeTiempo":[],"imagenHabla":"Imagen y habla se refuerzan.","edicion":"Los cortes acompañan los cambios de idea.","guion":[],"comentarios":[],"aprendizajes":["Entra rápido al conflicto."],"limitaciones":[]
  },
  {
    "id":"ejemplo-2","titulo":"Ejemplo 2","creador":"@creador","plataforma":"Instagram","url":"https://example.com/video-2","duracion":"00:42","ruta":"D","metricas":{"vistas":800,"likes":48,"comentarios":6,"compartidos":2},"hook":{"nota":6,"texto":"Otra apertura","analisis":"El tema aparece, pero la tensión tarda."},"diagnostico":"Buena idea con inicio genérico.","formato":"Lo-Fi","estructura":"AIDA","variablePrincipal":"Claridad de la promesa","cuadros":[],"lineaDeTiempo":[],"imagenHabla":"Solo se confirmó la portada.","edicion":"No confirmada visualmente.","guion":[],"comentarios":[],"aprendizajes":["Decir el conflicto en la primera frase."],"limitaciones":["Los cuadros intermedios no estaban accesibles."]
  }
]
</script>
<script>
  const data=JSON.parse(document.getElementById('sofia-data').textContent);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const n=v=>Number(v||0).toLocaleString('es-419');
  const rate=v=>v.metricas?.vistas?((Number(v.metricas.likes||0)/Number(v.metricas.vistas))*100).toFixed(2)+'%':'—';
  document.getElementById('meta').textContent=`${data.length} video${data.length===1?'':'s'} · dashboard único`;
  document.getElementById('nav').innerHTML=data.map((v,i)=>`<a href="#${esc(v.id||'video-'+i)}">${i+1}. ${esc(v.titulo)}</a>`).join('');
  const best=[...data].sort((a,b)=>(b.hook?.nota||0)-(a.hook?.nota||0))[0];
  document.getElementById('summary').innerHTML=`
    <article class="card"><h2>Visión general</h2><p>${data.length===1?'Un análisis completo.':'Comparación de '+data.length+' videos en el mismo lote.'}</p><p><strong>Mejor apertura:</strong> ${esc(best?.titulo)} (${esc(best?.hook?.nota)}/10)</p></article>
    <article class="card"><h2>Principal diferencia</h2><p>${esc(data.map(v=>v.variablePrincipal).filter(Boolean).join(' · ')||'Completar tras comparar el lote.')}</p></article>
    <article class="card wide table-wrap"><h2>Métricas lado a lado</h2><table><thead><tr><th>Video</th><th>Vistas</th><th>Likes</th><th>Comentarios</th><th>Compart.</th><th>Likes/vistas</th><th>Apertura</th></tr></thead><tbody>${data.map(v=>`<tr><td>${esc(v.titulo)}</td><td>${n(v.metricas?.vistas)}</td><td>${n(v.metricas?.likes)}</td><td>${n(v.metricas?.comentarios)}</td><td>${n(v.metricas?.compartidos)}</td><td>${rate(v)}</td><td>${esc(v.hook?.nota)}/10</td></tr>`).join('')}</tbody></table></article>`;
  document.getElementById('videos').innerHTML=data.map((v,i)=>`
    <section class="video" id="${esc(v.id||'video-'+i)}">
      <div class="video-head"><div><div class="eyebrow">${esc(v.plataforma)} · ruta ${esc(v.ruta)}</div><h2>${i+1}. ${esc(v.titulo)}</h2><div class="meta">${esc(v.creador)} · ${esc(v.duracion)} · <a href="${esc(v.url)}" target="_blank" rel="noreferrer">video original</a></div></div><div class="score">${esc(v.hook?.nota)}/10</div></div>
      <div class="grid">
        <article class="card"><h3>Diagnóstico</h3><p>${esc(v.diagnostico)}</p><p class="muted">${esc(v.formato)} · ${esc(v.estructura)}</p></article>
        <article class="card"><h3>Apertura</h3><p class="quote">${esc(v.hook?.texto)}</p><p>${esc(v.hook?.analisis)}</p></article>
        ${v.cuadros?.length?`<article class="card wide"><h3>Evidencias visuales</h3><div class="frames">${v.cuadros.map(q=>`<figure class="frame"><img src="${esc(q.src)}" alt="Cuadro en ${esc(q.tiempo)}"><figcaption>${esc(q.tiempo)} · ${esc(q.descripcion)}</figcaption></figure>`).join('')}</div></article>`:''}
        ${v.lineaDeTiempo?.length?`<article class="card wide"><h3>Línea de tiempo</h3><div class="timeline">${v.lineaDeTiempo.map(m=>`<div class="moment"><span class="time">${esc(m.tiempo)}</span> ${esc(m.descripcion)}</div>`).join('')}</div></article>`:''}
        <article class="card"><h3>Imagen + habla</h3><p>${esc(v.imagenHabla)}</p></article><article class="card"><h3>Edición y formato</h3><p>${esc(v.edicion)}</p></article>
        <article class="card wide"><h3>Guion anotado</h3><div class="script">${(v.guion||[]).map(r=>`<div class="line"><div>${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="quote">${esc(r.frase)}</p><p class="muted">${esc(r.analisis)}</p></div>`).join('')||'<p class="muted">Guion no disponible.</p>'}</div></article>
        <article class="card"><h3>Comentarios</h3><div class="comments">${(v.comentarios||[]).map(c=>`<div class="comment"><strong>${n(c.likes)} likes</strong><p>${esc(c.texto)}</p><p class="muted">${esc(c.insight)}</p></div>`).join('')||'<p class="muted">Comentarios no disponibles.</p>'}</div></article>
        <article class="card"><h3>Qué aprender</h3><ul>${(v.aprendizajes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>
        <article class="card wide warning"><h3>Limitaciones</h3><ul>${(v.limitaciones||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Ninguna limitación material registrada.</li>'}</ul></article>
      </div>
    </section>`).join('');
</script>
</body></html>
